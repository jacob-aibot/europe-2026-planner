<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cairn — three visual directions</title>
<!--
  The picker harness. Its markup, CSS and key wiring are copied VERBATIM from
  `cairn/.claude/skills/prototype/PICKER.md` (emilkowalski/skills @ d23d7f8). The one documented
  deviation: each variant is a full multi-state prototype, so a variant renders as an <iframe> of
  its own page rather than as inline markup. Every direction is also openable on its own:

      a-journey-map/index.html   b-plates/index.html   c-spatial/index.html

  Keys: 1/2/3 or the arrow keys switch. There is no replay button, because none of the three has
  an entrance animation to re-trigger — which is itself the motion decision (see MOTION-REVIEW).
-->
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0a; }
  #stage, #stage iframe { width: 100%; height: 100%; border: 0; display: block; }

  .proto-picker {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px;
    border-radius: 999px; background: rgba(10, 10, 10, 0.82);
    -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset, 0 8px 24px rgba(0,0,0,0.24),
                0 2px 6px rgba(0,0,0,0.12);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none;
  }
  .proto-picker-highlight {
    position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px;
    background: rgba(255,255,255,0.12); will-change: transform;
  }
  .proto-picker[data-ready] .proto-picker-highlight {
    transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
                width 250ms cubic-bezier(0.23, 1, 0.32, 1);
  }
  @media (prefers-reduced-motion: reduce) {
    .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
  }
  .proto-picker-item {
    position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px;
    border: 0; border-radius: 999px; background: transparent; color: rgba(255,255,255,0.55);
    font: inherit; cursor: pointer; transition: color 150ms ease-out;
  }
  .proto-picker-item:hover { color: rgba(255,255,255,0.85); }
  .proto-picker-item:active { transform: scale(0.97); }
  .proto-picker-item:focus-visible { outline: 2px solid rgba(255,255,255,0.4); outline-offset: 2px; }
  .proto-picker-item[data-active] { color: #fff; }
</style>
</head>
<body>
<div id="stage"></div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">A · Journey map</button>
  <button class="proto-picker-item">B · Plates</button>
  <button class="proto-picker-item">C · Spatial</button>
</nav>

<script>
const variants = [
  () => '<iframe src="a-journey-map/index.html" title="Direction A"></iframe>',
  () => '<iframe src="b-plates/index.html" title="Direction B"></iframe>',
  () => '<iframe src="c-spatial/index.html" title="Direction C"></iframe>',
];
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item')];
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function mount(i) {
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
});
setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
